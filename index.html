<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promoción 2026</title>
  <link rel="icon" type="image/png" href="iconm.png">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== FUENTES Y RESET ===== */
    @font-face {
      font-family: 'Starborn';
      src: url('Starborn.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Relife';
      src: url('Relife.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: black;
      color: white;
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    html, body { height: 100%; }
    .contenedor, .vista { height: 100%; }

    /* ===== SPLASH ===== */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #splash video {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 20px;
    }
    #splash .skip-btn {
      position: absolute;
      bottom: 20px; right: 20px;
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
    }
    .splash-hidden { display: none !important; }

    /* ===== FLORES ===== */
    @keyframes levitar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .levitar { animation: levitar 4s ease-in-out infinite; }
    .girar { animation: girar 20s linear infinite; }

    .contenedor { position: relative; width: 100%; height: 100%; }
    .flor {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    #flor1 { width: 230px; top: 7%; left: 7%; }
    #flor2 { width: 200px; top: 27%; right: 45%; }
    #flor3 { width: 400px; bottom: -15%; left: -4%; }
    #flor4 { width: 430px; bottom: -2%; right: -5%; }

    /* ===== VISTAS ===== */
    .vista {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: none;
      overflow-y: auto;
    }
    .vista.activa { display: block; }
    #vista-principal {
      background: transparent;
      position: relative;
    }

    /* Título */
    .titulo {
      position: absolute;
      font-family: 'Starborn', serif;
      z-index: 2;
    }
    .titulo .prom {
      font-size: 8rem;
      margin: 0;
      color: azure;
      line-height: 0.8;
    }
    .titulo .anio {
      font-size: 7rem;
      margin: 0;
      color: azure;
      line-height: 0.8;
    }

    /* Botones del menú */
    .boton {
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform 0.3s ease;
      cursor: pointer;
      z-index: 10;
    }
    .boton img { width: 100px; height: auto; }
    .boton span {
      font-family: 'Relife', serif;
      font-size: 3rem;
      color: white;
    }
    .boton:hover { transform: scale(1.1); }
    .boton-icono-adelante { flex-direction: row; }
    .boton-texto-adelante { flex-direction: row-reverse; }

    /* Burbujas de contenido */
    .vista-secundaria {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(3px);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      max-width: 800px;
      margin: 40px auto;
    }
    .vista-secundaria h2 {
      font-family: 'Starborn', serif;
      font-size: 4rem;
      margin-bottom: 30px;
      color: azure;
    }
    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 25px;
      border-radius: 40px;
      color: white;
      font-family: 'Relife', serif;
      font-size: 2rem;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .btn-volver:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

    /* ===== LOGIN FLOTANTE ===== */
    .btn-login-mini {
      position: fixed;
      z-index: 9999;
      background: #8387C3 ;
      color: black;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (min-width: 769px) {
      .btn-login-mini { top: 10%; left: 5%; }
    }
    @media (max-width: 720px) {
      .btn-login-mini { bottom: 20px; right: 20px; }
    }
    .user-info-area {
      position: fixed;
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      padding: 6px 15px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (min-width: 769px) {
      .user-info-area { top: 20px; right: 20px; }
    }
    @media (max-width: 720px) {
      .user-info-area { bottom: 20px; right: 20px; }
    }
    .user-info-area span { color: #02182E; }
    .cerrar-sesion {
      background: transparent;
      border: 1px solid #02182E;
      color: #02182E;
      padding: 4px 12px;
      border-radius: 30px;
      cursor: pointer;
    }
    .modal-login {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      width: 280px;
      text-align: center;
      border: 1px solid #CCDEE4;
    }
    .modal-content h3 {
      font-family: 'Starborn', serif;
      color: #CCDEE4;
      margin-bottom: 20px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 30px;
      background: #222;
      color: white;
    }
    .modal-content button {
      background: #CCDEE4;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal {
      float: right;
      font-size: 24px;
      cursor: pointer;
    }

    /* ===== BUZÓN ===== */
    .mensajes-lista {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    .mensaje-item {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #d0c5f4;
    }
    .mensaje-fecha { font-size: 0.9rem; color: #d0c5f4; }
    .mensaje-ip { font-size: 0.8rem; color: #aaa; font-family: monospace; }
    .mensaje-texto { font-size: 1rem; word-wrap: break-word; }
    .formulario-mensaje textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
    }
    .formulario-mensaje button {
      background: #B4B5DF;
      border: none;
      padding: 10px 30px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ===== ACTIVIDADES Y PARTIDOS ===== */
    .actividad-card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      cursor: pointer;
      transition: 0.3s;
      border-left: 5px solid #A9A1C7;
    }
    .actividad-card:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.02);
    }
    .actividad-titulo {
      font-size: 2rem;
      font-weight: bold;
      color: #A9A1C7;
    }
    .actividad-desc {
      font-size: 1.2rem;
      margin-top: 10px;
    }
    .partido-info {
      text-align: center;
    }
    .marcador {
      font-size: 3rem;
      font-weight: bold;
      background: rgba(0,0,0,0.5);
      display: inline-block;
      padding: 15px 30px;
      border-radius: 60px;
      margin: 20px 0;
    }
    .fotos-partido {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .fotos-partido img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 15px;
      border: 2px solid #A9A1C7;
      cursor: pointer;
    }

    /* ===== EVENTOS FLOTANTES ===== */
    .evento-flotante {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px;
      border: 1px solid #5569a5;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      z-index: 20;
      transition: transform 0.3s ease;
      cursor: pointer;
      max-width: 240px;
    }
    .evento-flotante:hover { transform: scale(1.02); }
    .evento-flotante img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .evento-titulo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #969ced;
      margin-bottom: 5px;
    }
    .evento-desc {
      font-size: 0.85rem;
      color: #ddd;
      line-height: 1.3;
    }
    .evento-fecha {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 6px;
    }

    /* Posiciones para eventos (PC y móvil) */
    .evento-pos-tr {
      top: 3%;
      right: 5%;
      bottom: auto;
      left: auto;
    }
    @media (min-width: 769px) {
      .evento-flotante { max-width: 260px; padding: 15px; }
      .evento-flotante img { height: 150px; }
      .evento-pos-tr { bottom: 15%; left: 8%; top: auto; right: auto; }
    }
    @media (max-width: 720px) {
      .evento-flotante { max-width: 150px; padding: 8px; }
      .evento-flotante img { height: 90px; }
      .evento-pos-tr { top: 2%; right: 5%; }
    }

    /* Selector de torneos */
    .selector-torneos {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .btn-torneo {
      background: rgba(200,141,248,0.3);
      border: 1px solid #A9A1C7;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .btn-torneo.activo {
      background: #A9A1C7;
      color: black;
      font-weight: bold;
    }
    .btn-torneo:hover {
      background: #A9A1C7;
      color: black;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 10px;
    }
    .lightbox .close-lightbox {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 3rem;
      color: white;
      cursor: pointer;
    }

    /* ===== MEDIA QUERIES ===== */
    @media (min-width: 769px) {
      .titulo { top: 38%; left: 12%; text-align: left; }
      .titulo .anio { margin-left: 300px; }
      #boton-avisos, #boton-mundialito { flex-direction: row-reverse; }
      #boton-buzon, #boton-Actividades { flex-direction: row; }
      #boton-avisos { position: absolute; top: 20%; right: 8%; }
      #boton-buzon { position: absolute; top: 38%; right: 8%; }
      #boton-mundialito { position: absolute; top: 56%; right: 8%; }
      #boton-Actividades { position: absolute; top: 74%; right: 8%; }
      .boton img { width: 120px; }
      .vista-secundaria { width: 60%; margin: 40px auto; }
    }
    @media (max-width: 720px) {
      .titulo { top: 30%; left: 20%; white-space: nowrap; }
      .titulo .prom { font-size: 4.5rem; margin-left: -10%; }
      .titulo .anio { font-size: 3.5rem; margin-left: 20px; }
      #flor1 { width: 150px; top: 2%; left: 2%; }
      #flor2 { width: 100px; top: 43%; right: 60%; }
      #flor3 { width: 200px; top: -5%; left: 70%; transform: rotate(180deg); }
      #flor4 { width: 320px; bottom: -10%; right: -25%; }
      .boton-icono-adelante, .boton-texto-adelante { flex-direction: row-reverse; }
      #boton-avisos { position: absolute; top: 55%; right: 3%; }
      #boton-buzon { position: absolute; top: 63%; left: 10%; }
      #boton-mundialito { position: absolute; bottom: 15%; right: 3%; }
      #boton-Actividades { position: absolute; bottom: 4%; left: 10%; }
      .boton img { width: 70px; }
      .boton span { font-size: 2rem; }
      .vista-secundaria { 
        padding: 15px; 
        width: 95%; 
        margin: 20px auto; 
      }
      .vista-secundaria h2 { font-size: 2rem; }
      .vista {
        padding-top: 20px; /* evita que el contenido quede muy arriba */
      }
    }
       /* Estilos para avisos dinámicos */
      .aviso-item {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      border-left: 5px solid #3A5074;
      transition: 0.3s;
      backdrop-filter: blur(2px);
     }
      .aviso-item:hover {
      background: #A9A1C7;
      transform: translateX(5px);
     }
      .aviso-destacado {
      background: #3A5074;
      border-left: 5px solid #A7C7E7;
      box-shadow: 0 0 12px rgba(200,141,248,0.3);
     }
      .aviso-fecha {
      font-size: 1rem;
      font-weight: bold;
      color: #A7C7E7;
      margin-bottom: 8px;
      letter-spacing: 1px;
     }
      .aviso-titulo {
      font-size: 1.6rem;
      font-weight: bold;
      color: #A7C7E7;
      margin-bottom: 10px;
     }
      .aviso-desc {
      font-size: 1.1rem;
      line-height: 1.4;
      color: #ddd;
     }
      .aviso-link {
      display: inline-block;
      margin-top: 12px;
      color: #A7C7E7;
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px dashed;
     }
      .aviso-link:hover {
      color: white;
     }

     /* Estilos para la programación */
.agenda-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.evento-agenda {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 18px;
  border-left: 5px solid #A7C7E7;
  transition: 0.3s;
}
.evento-agenda:hover {
  background: rgba(255,255,255,0.15);
  transform: scale(1.01);
}
.evento-agenda-fecha {
  font-size: 0.9rem;
  color: #A7C7E7;
  font-weight: bold;
  margin-bottom: 8px;
}
.evento-agenda-titulo {
  font-size: 1.5rem;
  font-weight: bold;
  color: #A7C7E7;
  margin-bottom: 5px;
}
.evento-agenda-lugar {
  font-size: 0.9rem;
  color: #aaa;
  margin-bottom: 10px;
}
.evento-agenda-desc {
  font-size: 1rem;
  line-height: 1.4;
}

.concurso-info {
  background: #3A5074;
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
  text-align: center;
}
.jurados {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 15px 0;
}
.jurado {
  background: rgba(0,0,0,0.5);
  padding: 8px 18px;
  border-radius: 40px;
  font-weight: bold;
}
/* Galería tipo mural (disperso) */
.mural-fotos {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
}
.mural-fotos img {
  width: auto;
  max-width: 200px;
  height: auto;
  max-height: 180px;
  object-fit: cover;
  border-radius: 20px;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor: pointer;
}
/* Diferentes tamaños para efecto disperso */
.mural-fotos img:nth-child(odd) {
  transform: rotate(-2deg) scale(0.98);
}
.mural-fotos img:nth-child(3n) {
  transform: rotate(3deg) scale(1.02);
}
.mural-fotos img:nth-child(5n) {
  transform: rotate(-1deg) scale(0.95);
}
.mural-fotos img:hover {
  transform: scale(1.05) rotate(0deg);
  z-index: 5;
}
@media (max-width: 720px) {
  .mural-fotos img {
    max-width: 130px;
    max-height: 120px;
  }
}

.concurso-info {
  background: rgba(200,141,248,0.15);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  border: 1px solid #3A5074;
}
.concurso-info ul {
  text-align: left;
  margin: 10px auto;
  display: inline-block;
}

.tabla-posiciones {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  overflow: hidden;
}
.tabla-posiciones th,
.tabla-posiciones td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.tabla-posiciones th {
  background: #3A5074;
  color: #3A5074;
}
.btn-editar-tabla {
  background: #3A5074;
  border: none;
  padding: 8px 20px;
  border-radius: 30px;
  cursor: pointer;
  margin-top: 15px;
}

/* ===== AJUSTES PARA TABLAS Y TEXTOS EN MÓVIL ===== */
.vista-secundaria {
  overflow-x: auto;  /* permite desplazamiento horizontal si es necesario */
  word-wrap: break-word;
  max-width: 95%;
  width: 100%;
}

/* Tabla de posiciones responsive */
.tabla-posiciones {
  width: 100%;
  min-width: 300px;
  border-collapse: collapse;
  margin: 20px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  overflow-x: auto;
  display: block;
}
.tabla-posiciones thead,
.tabla-posiciones tbody,
.tabla-posiciones tr {
  display: table;
  width: 100%;
  table-layout: fixed;
}
.tabla-posiciones th,
.tabla-posiciones td {
  padding: 8px 6px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 0.85rem;
  word-break: break-word;
}
.tabla-posiciones th {
  background: #3A5074;
  color: #A7C7E7;
}

/* Para pantallas muy pequeñas (móvil) */
@media (max-width: 550px) {
  .tabla-posiciones th,
  .tabla-posiciones td {
    padding: 6px 3px;
    font-size: 0.7rem;
  }
  .actividad-titulo {
    font-size: 1.4rem;
  }
  .actividad-desc {
    font-size: 0.9rem;
  }
  .vista-secundaria h2 {
    font-size: 1.8rem;
  }
  .btn-volver {
    font-size: 1.2rem;
    padding: 6px 15px;
  }
}

/* Tarjetas de equipos y partidos - que el texto no se salga */
.actividad-card {
  word-break: break-word;
  overflow-wrap: break-word;
  padding: 15px;
}
.actividad-card .actividad-desc {
  font-size: 0.9rem;
  line-height: 1.3;
}

/* Botón editar pequeño */
.btn-editar, .btn-editar-tabla {
  background: #A7C7E7;
  border: none;
  padding: 4px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.8rem;
  margin-top: 8px;
  display: inline-block;
}
  </style>
</head>
<body>
  <!-- SPLASH -->
  <div id="splash">
    <video id="introVideo" autoplay muted playsinline>
      <source src="splash.mp4" type="video/mp4">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>
    <button class="skip-btn" onclick="ocultarSplash()">Saltar</button>
  </div>

  <div class="contenedor">
    <!-- Flores -->
    <img src="FT3.png" id="flor1" class="flor levitar" alt="Flor">

          } else videoHtml = `<a href="${partido.linkVideo}" target="_blank">Ver video</a>`;
        }
        return `<div id="vista-${prefijo}_${partido.id}" class="vista"><div class="vista-secundaria partido-info"><div class="btn-volver" onclick="mostrarVista('Actividades')">← Volver a Actividades</div><h2>${partido.titulo}</h2><div class="marcador">${partido.marcador}</div><p><strong>Fecha:</strong> ${partido.fecha}</p><p><strong>Lugar:</strong> ${partido.lugar}</p>${videoHtml}${goleadoresHtml}<h3>📸 Fotos del partido:</h3><div class="fotos-partido">${fotosHtml}</div></div></div>`;
      }
      partidosMicro.forEach(p => html += generarHTMLPartido(p, 'micro'));
      partidos.forEach(p => { if (p.titulo && p.marcador) html += generarHTMLPartido(p, ''); });
      container.innerHTML = html;
    }

    function mostrarVistaPartido(vistaIdCompleta) {
      document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
      const target = document.getElementById(`vista-${vistaIdCompleta}`);
      if (target) target.classList.add('activa');
    }

    const eventosEspeciales = [{ id: "decoracion", titulo: "🎨 Día de Decoración", descripcion: "Hoy todo el día decoramos el salón. ¡Trae tu creatividad!", fecha: "2025-04-17", posicionClase: "evento-pos-tr" }];
    function mostrarEventosFlotantes() { /* no se usa en esta versión */ }

    // ==================== COPA MUNDIALITO (con subcards, equipos y programación) ====================
    async function cargarEnlaceCopa() {
      const doc = await db.collection('copaEnlace').doc('info').get();
      return doc.exists ? doc.data().url : '#';
    }
    async function actualizarEnlaceCopa(url) {
      if (!isAdmin) return;
      await db.collection('copaEnlace').doc('info').set({ url });
      await mostrarCopaMundialito();
    }
    async function cargarPartidosCopa() {
      const snap = await db.collection('copaPartidos').orderBy('fecha').get();
      return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }
    async function editarPartidoCopa(partidoId, resultado) {
      if (!isAdmin) return;
      await db.collection('copaPartidos').doc(partidoId).update({ resultado });
      await mostrarCopaMundialito();
    }
    async function agregarPartidoCopa(partido) {
      if (!isAdmin) return;
      await db.collection('copaPartidos').add(partido);
      await mostrarCopaMundialito();
    }
    async function eliminarPartidoCopa(partidoId) {
      if (!isAdmin) return;
      await db.collection('copaPartidos').doc(partidoId).delete();
      await mostrarCopaMundialito();
    }

    async function cargarEquiposPorCategoria(categoria) {
      const snap = await db.collection('copaEquipos').where('categoria', '==', categoria).get();
      return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }
    async function agregarEquipoCopa(categoria, nombreEquipo, entrenador = '') {
      if (!isAdmin) return;
      await db.collection('copaEquipos').add({ categoria, nombreEquipo, entrenador });
    }
    async function editarEquipoCopa(equipoId, nuevoNombre, nuevoEntrenador) {
      if (!isAdmin) return;
      await db.collection('copaEquipos').doc(equipoId).update({ nombreEquipo: nuevoNombre, entrenador: nuevoEntrenador });
    }
    async function eliminarEquipoCopa(equipoId) {
      if (!isAdmin) return;
      await db.collection('copaEquipos').doc(equipoId).delete();
    }

    async function mostrarCopaMundialito() {
      const container = document.getElementById('vistas-inauguracion-container');
      if (!container) return;
      const enlace = await cargarEnlaceCopa();
      const partidos = await cargarPartidosCopa();
      const existing = document.getElementById('vista-copa_copa2026');
      if (existing) existing.remove();

      const categorias = [
        { id: 'juvenil', nombre: '🏆 Juvenil (9 - Profes)' },
        { id: 'prejuvenil', nombre: '🥈 Prejuvenil (6 - 8)' },
        { id: 'infantil', nombre: '🥉 Infantil (4 - 5)' },
        { id: 'preinfantil', nombre: '🌟 Pre infantil (2 - 3)' }
      ];
      let subcardsHtml = '<div style="display: flex; flex-direction: column; gap: 15px;">';
      for (const cat of categorias) {
        subcardsHtml += `<div class="actividad-card" style="border-left-color: #A7C7E7; cursor: pointer;" onclick="mostrarEquiposPorCategoria('${cat.id}', '${cat.nombre}')"><div class="actividad-titulo">${cat.nombre}</div><div class="actividad-desc">Haz clic para ver los equipos</div></div>`;
      }
      subcardsHtml += '</div>';

      let tablaHtml = '';
      if (partidos.length === 0) {
        tablaHtml = '<p style="text-align:center; padding:20px;">No hay partidos programados aún.</p>';
      } else {
        tablaHtml = `<div style="overflow-x: auto;"><table class="tabla-posiciones" style="min-width: 350px;"><thead><tr><th>Fecha</th><th>Hora</th><th>Equipo A</th><th>Equipo B</th><th>Resultado</th><th>Acciones</th></tr></thead><tbody>${partidos.map(p => `<tr><td>${p.fecha || '?'}</td><td>${p.hora || '?'}</td><td>${p.equipoA || '?'}</td><td>${p.equipoB || '?'}</td><td>${p.resultado || '—'}</td><td>${isAdmin ? `<button class="btn-editar" onclick="editarResultadoCopa('${p.id}')">✏️</button> <button class="btn-editar" onclick="eliminarPartidoCopa('${p.id}')">🗑️</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
      }

      let html = `<div id="vista-copa_copa2026" class="vista"><div class="vista-secundaria"><div class="btn-volver" onclick="mostrarVista('mundialito')">← Volver a Mundialito</div><h2>🏆 Copa Mundialito</h2><div class="actividad-card" style="border-left-color: #A7C7E7;"><div class="actividad-titulo">🔗 Enlace oficial</div><div class="actividad-desc"><a href="${enlace}" target="_blank" class="aviso-link">Ir al bracket / transmisión</a>${isAdmin ? `<button class="btn-editar" onclick="editarEnlaceCopa()">✏️ Editar enlace</button>` : ''}</div></div><div class="actividad-card" style="border-left-color: #A7C7E7;"><div class="actividad-titulo">📋 Clasificación por categorías</div><div class="actividad-desc">${subcardsHtml}</div></div><div class="actividad-card" style="border-left-color: #A7C7E7;"><div class="actividad-titulo">📅 Calendario de partidos</div><div class="actividad-desc">${tablaHtml}${isAdmin ? `<button class="btn-editar-tabla" onclick="agregarPartidoCopaPrompt()">➕ Agregar partido</button>` : ''}</div></div></div></div>`;
      container.innerHTML = html;
    }

    async function mostrarEquiposPorCategoria(categoriaId, categoriaNombre) {
      const equipos = await cargarEquiposPorCategoria(categoriaId);
      const container = document.getElementById('vistas-inauguracion-container');
      if (!container) return;
      const vistaExistente = document.getElementById(`vista-equipos-${categoriaId}`);
      if (vistaExistente) vistaExistente.remove();

      let equiposHtml = '';
      if (equipos.length === 0) {
        equiposHtml = '<p>No hay equipos registrados en esta categoría.</p>';
      } else {
        equiposHtml = `<ul style="margin-top: 10px;">${equipos.map(e => `<li style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 10px;"><span><strong>${e.nombreEquipo}</strong> ${e.entrenador ? `(Entrenador: ${e.entrenador})` : ''}</span>${isAdmin ? `<div><button class="btn-editar" onclick="editarEquipoPrompt('${e.id}', '${e.nombreEquipo}', '${e.entrenador || ''}', '${categoriaId}')">✏️</button> <button class="btn-editar" onclick="eliminarEquipoCopa('${e.id}').then(() => mostrarEquiposPorCategoria('${categoriaId}', '${categoriaNombre}'))">🗑️</button></div>` : ''}</li>`).join('')}</ul>`;
      }
      const html = `<div id="vista-equipos-${categoriaId}" class="vista"><div class="vista-secundaria"><div class="btn-volver" onclick="mostrarVista('copa_copa2026')">← Volver a Copa</div><h2>🏅 ${categoriaNombre}</h2><div class="actividad-card" style="border-left-color: #A7C7E7;"><div class="actividad-titulo">📋 Equipos</div><div class="actividad-desc">${equiposHtml}${isAdmin ? `<button class="btn-editar-tabla" onclick="agregarEquipoPrompt('${categoriaId}')">➕ Agregar equipo</button>` : ''}</div></div></div></div>`;
      container.innerHTML += html;
      const target = document.getElementById(`vista-equipos-${categoriaId}`);
      if (target) { document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa')); target.classList.add('activa'); }
    }

    async function editarEnlaceCopa() { const nuevaUrl = prompt("Nueva URL:", await cargarEnlaceCopa()); if (nuevaUrl) await actualizarEnlaceCopa(nuevaUrl); }
    async function editarResultadoCopa(id) { const nuevo = prompt("Resultado (ej: 2-1):"); if (nuevo !== null) await editarPartidoCopa(id, nuevo); }
    async function agregarPartidoCopaPrompt() { const fecha = prompt("Fecha (YYYY-MM-DD):"); const hora = prompt("Hora:"); const equipoA = prompt("Equipo A:"); const equipoB = prompt("Equipo B:"); if (fecha && hora && equipoA && equipoB) await agregarPartidoCopa({ fecha, hora, equipoA, equipoB, resultado: "" }); }
    async function eliminarPartidoCopa(id) { if (confirm("¿Eliminar?")) await eliminarPartidoCopa(id); }
    function agregarEquipoPrompt(categoria) { const nombre = prompt("Nombre del equipo:"); if (!nombre) return; const entrenador = prompt("Entrenador (opcional):"); agregarEquipoCopa(categoria, nombre, entrenador || '').then(() => mostrarEquiposPorCategoria(categoria, obtenerNombreCategoria(categoria))); }
    function editarEquipoPrompt(id, nombreActual, entrenadorActual, categoria) { const nuevoNombre = prompt("Nuevo nombre del equipo:", nombreActual); if (!nuevoNombre && nuevoNombre !== '') return; const nuevoEntrenador = prompt("Entrenador:", entrenadorActual); editarEquipoCopa(id, nuevoNombre, nuevoEntrenador).then(() => mostrarEquiposPorCategoria(categoria, obtenerNombreCategoria(categoria))); }
    function obtenerNombreCategoria(categoriaId) { const cats = { juvenil: '🏆 Juvenil (9 - Profes)', prejuvenil: '🥈 Prejuvenil (6 - 8)', infantil: '🥉 Infantil (4 - 5)', preinfantil: '🌟 Pre infantil (2 - 3)' }; return cats[categoriaId] || categoriaId; }

    // NAVEGACIÓN GENERAL
    function mostrarVista(vistaId) {
      document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
      if (vistaId === 'principal') {
        document.getElementById('vista-principal').classList.add('activa');
        return;
      }
      if (vistaId === 'copa_copa2026') {
        let target = document.getElementById(`vista-${vistaId}`);
        if (!target) { mostrarCopaMundialito(); target = document.getElementById(`vista-${vistaId}`); }
        if (target) target.classList.add('activa');
        else console.error('No se pudo generar la vista de la copa');
        return;
      }
      const target = document.getElementById(`vista-${vistaId}`);
      if (target) {
        target.classList.add('activa');
        if (vistaId === 'buzon') inicializarBuzon();
        if (vistaId === 'mundialito') { generarVistaInauguracion(); mostrarCardInauguracion(); mostrarCardCopa(); }
      } else {
        if (vistaId.startsWith('galeria_') || vistaId.startsWith('concurso_')) {
          generarVistaInauguracion();
          setTimeout(() => { const retry = document.getElementById(`vista-${vistaId}`); if (retry) { document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa')); retry.classList.add('activa'); } else console.error('No se pudo encontrar la vista:', vistaId); }, 50);
        }
      }
    }

    function abrirLightbox(url) { const lightbox = document.getElementById('lightbox'); const img = document.getElementById('lightbox-img'); img.src = url; lightbox.style.display = 'flex'; }
    function cerrarLightbox() { document.getElementById('lightbox').style.display = 'none'; }

    // INICIALIZACIÓN
    window.onload = () => {
      registrarVisita();
      pedirNotificacion();
      generarVistaInauguracion();
      mostrarCardInauguracion(); 
      mostrarCardCopa();
      cargarAvisos();
      generarVistasPartidos();
      mostrarTorneo('volei');
      document.querySelectorAll('.btn-torneo').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-torneo').forEach(b => b.classList.remove('activo'));
          btn.classList.add('activo');
          mostrarTorneo(btn.getAttribute('data-torneo'));
        });
      });
      mostrarVista('principal');
      actualizarUIAdmin();
      document.getElementById('btn-login').onclick = abrirModal;
      document.getElementById('ingresar-admin').onclick = loginDesdeModal;
      document.querySelector('.close-modal').onclick = cerrarModal;
      window.onclick = e => { if (e.target === document.getElementById('modal-login')) cerrarModal(); };
    };

    function pedirNotificacion() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") new Notification("🎉 Promoción 2026", { body: "¡Bienvenido! Revisa los avisos y actividades." });
      else if (Notification.permission !== "denied") Notification.requestPermission().then(permission => { if (permission === "granted") new Notification("🎉 Promoción 2026", { body: "¡Notificaciones activadas! Te avisaremos de novedades." }); });
    }
  </script>
</body>
</html>
