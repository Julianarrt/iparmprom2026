<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Promoción 2026</title>
  <link rel="icon" type="image/png" href="iconm.png">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== FUENTES Y RESET ===== */
    @font-face {
      font-family: 'Starborn';
      src: url('Starborn.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Relife';
      src: url('Relife.ttf') format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: black;
      color: white;
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    html, body { height: 100%; }
    .contenedor, .vista { height: 100%; }

    /* ===== SPLASH ===== */
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #splash video {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 20px;
    }
    #splash .skip-btn {
      position: absolute;
      bottom: 20px; right: 20px;
      background: rgba(255,255,255,0.3);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
    }
    .splash-hidden { display: none !important; }

    /* ===== FLORES ===== */
    @keyframes levitar {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .levitar { animation: levitar 4s ease-in-out infinite; }
    .girar { animation: girar 20s linear infinite; }

    .contenedor { position: relative; width: 100%; height: 100%; }
    .flor {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }
    #flor1 { width: 230px; top: 7%; left: 7%; }
    #flor2 { width: 200px; top: 27%; right: 45%; }
    #flor3 { width: 400px; bottom: -15%; left: -4%; }
    #flor4 { width: 430px; bottom: -2%; right: -5%; }

    /* ===== VISTAS ===== */
    .vista {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: none;
      overflow-y: auto;
    }
    .vista.activa { display: block; }
    #vista-principal {
      background: transparent;
      position: relative;
    }

    /* Título */
    .titulo {
      position: absolute;
      font-family: 'Starborn', serif;
      z-index: 2;
    }
    .titulo .prom {
      font-size: 8rem;
      margin: 0;
      color: azure;
      line-height: 0.8;
    }
    .titulo .anio {
      font-size: 7rem;
      margin: 0;
      color: azure;
      line-height: 0.8;
    }

    /* Botones del menú */
    .boton {
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform 0.3s ease;
      cursor: pointer;
      z-index: 10;
    }
    .boton img { width: 100px; height: auto; }
    .boton span {
      font-family: 'Relife', serif;
      font-size: 3rem;
      color: white;
    }
    .boton:hover { transform: scale(1.1); }
    .boton-icono-adelante { flex-direction: row; }
    .boton-texto-adelante { flex-direction: row-reverse; }

    /* Burbujas de contenido */
    .vista-secundaria {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(3px);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      max-width: 800px;
      margin: 40px auto;
    }
    .vista-secundaria h2 {
      font-family: 'Starborn', serif;
      font-size: 4rem;
      margin-bottom: 30px;
      color: azure;
    }
    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 25px;
      border-radius: 40px;
      color: white;
      font-family: 'Relife', serif;
      font-size: 2rem;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .btn-volver:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

    /* ===== LOGIN FLOTANTE ===== */
    .btn-login-mini {
      position: fixed;
      z-index: 9999;
      background: #c88df8cc;
      color: black;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (min-width: 769px) {
      .btn-login-mini { top: 10%; left: 5%; }
    }
    @media (max-width: 720px) {
      .btn-login-mini { bottom: 20px; right: 20px; }
    }
    .user-info-area {
      position: fixed;
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      padding: 6px 15px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (min-width: 769px) {
      .user-info-area { top: 20px; right: 20px; }
    }
    @media (max-width: 720px) {
      .user-info-area { bottom: 20px; right: 20px; }
    }
    .user-info-area span { color: #c88df8; }
    .cerrar-sesion {
      background: transparent;
      border: 1px solid #c88df8;
      color: #c88df8;
      padding: 4px 12px;
      border-radius: 30px;
      cursor: pointer;
    }
    .modal-login {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      width: 280px;
      text-align: center;
      border: 1px solid #c88df8;
    }
    .modal-content h3 {
      font-family: 'Starborn', serif;
      color: #c88df8;
      margin-bottom: 20px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 30px;
      background: #222;
      color: white;
    }
    .modal-content button {
      background: #c88df8cc;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal {
      float: right;
      font-size: 24px;
      cursor: pointer;
    }

    /* ===== BUZÓN ===== */
    .mensajes-lista {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    .mensaje-item {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #c88df8;
    }
    .mensaje-fecha { font-size: 0.9rem; color: #c88df8; }
    .mensaje-ip { font-size: 0.8rem; color: #aaa; font-family: monospace; }
    .mensaje-texto { font-size: 1rem; word-wrap: break-word; }
    .formulario-mensaje textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
    }
    .formulario-mensaje button {
      background: #c88df8cc;
      border: none;
      padding: 10px 30px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ===== ACTIVIDADES Y PARTIDOS ===== */
    .actividad-card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      cursor: pointer;
      transition: 0.3s;
      border-left: 5px solid #c88df8;
    }
    .actividad-card:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.02);
    }
    .actividad-titulo {
      font-size: 2rem;
      font-weight: bold;
      color: #c88df8;
    }
    .actividad-desc {
      font-size: 1.2rem;
      margin-top: 10px;
    }
    .partido-info {
      text-align: center;
    }
    .marcador {
      font-size: 3rem;
      font-weight: bold;
      background: rgba(0,0,0,0.5);
      display: inline-block;
      padding: 15px 30px;
      border-radius: 60px;
      margin: 20px 0;
    }
    .fotos-partido {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .fotos-partido img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 15px;
      border: 2px solid #c88df8;
      cursor: pointer;
    }

    /* ===== EVENTOS FLOTANTES ===== */
    .evento-flotante {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px;
      border: 1px solid #5569a5;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      z-index: 20;
      transition: transform 0.3s ease;
      cursor: pointer;
      max-width: 240px;
    }
    .evento-flotante:hover { transform: scale(1.02); }
    .evento-flotante img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .evento-titulo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #969ced;
      margin-bottom: 5px;
    }
    .evento-desc {
      font-size: 0.85rem;
      color: #ddd;
      line-height: 1.3;
    }
    .evento-fecha {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 6px;
    }

    /* Posiciones para eventos (PC y móvil) */
    .evento-pos-tr {
      top: 3%;
      right: 5%;
      bottom: auto;
      left: auto;
    }
    @media (min-width: 769px) {
      .evento-flotante { max-width: 260px; padding: 15px; }
      .evento-flotante img { height: 150px; }
      .evento-pos-tr { bottom: 15%; left: 8%; top: auto; right: auto; }
    }
    @media (max-width: 720px) {
      .evento-flotante { max-width: 150px; padding: 8px; }
      .evento-flotante img { height: 90px; }
      .evento-pos-tr { top: 2%; right: 5%; }
    }

    /* Selector de torneos */
    .selector-torneos {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .btn-torneo {
      background: rgba(200,141,248,0.3);
      border: 1px solid #c88df8;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: 0.3s;
    }
    .btn-torneo.activo {
      background: #c88df8;
      color: black;
      font-weight: bold;
    }
    .btn-torneo:hover {
      background: #c88df8cc;
      color: black;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 10px;
    }
    .lightbox .close-lightbox {
      position: absolute;
      top: 20px;
      right: 40px;
      font-size: 3rem;
      color: white;
      cursor: pointer;
    }

    /* ===== MEDIA QUERIES ===== */
    @media (min-width: 769px) {
      .titulo { top: 38%; left: 12%; text-align: left; }
      .titulo .anio { margin-left: 300px; }
      #boton-avisos, #boton-mundialito { flex-direction: row-reverse; }
      #boton-buzon, #boton-Actividades { flex-direction: row; }
      #boton-avisos { position: absolute; top: 20%; right: 8%; }
      #boton-buzon { position: absolute; top: 38%; right: 8%; }
      #boton-mundialito { position: absolute; top: 56%; right: 8%; }
      #boton-Actividades { position: absolute; top: 74%; right: 8%; }
      .boton img { width: 120px; }
      .vista-secundaria { width: 60%; margin: 40px auto; }
    }
    @media (max-width: 720px) {
      .titulo { top: 30%; left: 20%; white-space: nowrap; }
      .titulo .prom { font-size: 4.5rem; margin-left: -10%; }
      .titulo .anio { font-size: 3.5rem; margin-left: 20px; }
      #flor1 { width: 150px; top: 2%; left: 2%; }
      #flor2 { width: 100px; top: 43%; right: 60%; }
      #flor3 { width: 200px; top: -5%; left: 70%; transform: rotate(180deg); }
      #flor4 { width: 320px; bottom: -10%; right: -25%; }
      .boton-icono-adelante, .boton-texto-adelante { flex-direction: row-reverse; }
      #boton-avisos { position: absolute; top: 55%; right: 3%; }
      #boton-buzon { position: absolute; top: 63%; left: 10%; }
      #boton-mundialito { position: absolute; bottom: 15%; right: 3%; }
      #boton-Actividades { position: absolute; bottom: 4%; left: 10%; }
      .boton img { width: 70px; }
      .boton span { font-size: 2rem; }
      .vista-secundaria { 
        padding: 15px; 
        width: 95%; 
        margin: 20px auto; 
      }
      .vista-secundaria h2 { font-size: 2rem; }
      .vista {
        padding-top: 20px; /* evita que el contenido quede muy arriba */
      }
    }
       /* Estilos para avisos dinámicos */
      .aviso-item {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      border-left: 5px solid #c88df8;
      transition: 0.3s;
      backdrop-filter: blur(2px);
     }
      .aviso-item:hover {
      background: rgba(255,255,255,0.15);
      transform: translateX(5px);
     }
      .aviso-destacado {
      background: rgba(200,141,248,0.2);
      border-left: 5px solid #ffd966;
      box-shadow: 0 0 12px rgba(200,141,248,0.3);
     }
      .aviso-fecha {
      font-size: 1rem;
      font-weight: bold;
      color: #ffd966;
      margin-bottom: 8px;
      letter-spacing: 1px;
     }
      .aviso-titulo {
      font-size: 1.6rem;
      font-weight: bold;
      color: #c88df8;
      margin-bottom: 10px;
     }
      .aviso-desc {
      font-size: 1.1rem;
      line-height: 1.4;
      color: #ddd;
     }
      .aviso-link {
      display: inline-block;
      margin-top: 12px;
      color: #ffd966;
      text-decoration: none;
      font-weight: bold;
      border-bottom: 1px dashed;
     }
      .aviso-link:hover {
      color: white;
     }

     /* Estilos para la programación */
.agenda-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.evento-agenda {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 18px;
  border-left: 5px solid #ffd966;
  transition: 0.3s;
}
.evento-agenda:hover {
  background: rgba(255,255,255,0.15);
  transform: scale(1.01);
}
.evento-agenda-fecha {
  font-size: 0.9rem;
  color: #ffd966;
  font-weight: bold;
  margin-bottom: 8px;
}
.evento-agenda-titulo {
  font-size: 1.5rem;
  font-weight: bold;
  color: #c88df8;
  margin-bottom: 5px;
}
.evento-agenda-lugar {
  font-size: 0.9rem;
  color: #aaa;
  margin-bottom: 10px;
}
.evento-agenda-desc {
  font-size: 1rem;
  line-height: 1.4;
}

.concurso-info {
  background: rgba(200,141,248,0.2);
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
  text-align: center;
}
.jurados {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 15px 0;
}
.jurado {
  background: rgba(0,0,0,0.5);
  padding: 8px 18px;
  border-radius: 40px;
  font-weight: bold;
}
/* Galería tipo mural (disperso) */
.mural-fotos {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
}
.mural-fotos img {
  width: auto;
  max-width: 200px;
  height: auto;
  max-height: 180px;
  object-fit: cover;
  border-radius: 20px;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor: pointer;
}
/* Diferentes tamaños para efecto disperso */
.mural-fotos img:nth-child(odd) {
  transform: rotate(-2deg) scale(0.98);
}
.mural-fotos img:nth-child(3n) {
  transform: rotate(3deg) scale(1.02);
}
.mural-fotos img:nth-child(5n) {
  transform: rotate(-1deg) scale(0.95);
}
.mural-fotos img:hover {
  transform: scale(1.05) rotate(0deg);
  z-index: 5;
}
@media (max-width: 720px) {
  .mural-fotos img {
    max-width: 130px;
    max-height: 120px;
  }
}

.concurso-info {
  background: rgba(200,141,248,0.15);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  border: 1px solid rgba(200,141,248,0.3);
}
.concurso-info ul {
  text-align: left;
  margin: 10px auto;
  display: inline-block;
}
  </style>
</head>
<body>
  <!-- SPLASH -->
  <div id="splash">
    <video id="introVideo" autoplay muted playsinline>
      <source src="splash.mp4" type="video/mp4">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>
    <button class="skip-btn" onclick="ocultarSplash()">Saltar</button>
  </div>

  <div class="contenedor">
    <!-- Flores -->
    <img src="FT3.png" id="flor1" class="flor levitar" alt="Flor">
    <img src="FSL.png" id="flor2" class="flor girar" alt="Flor">
    <img src="FGR.png" id="flor3" class="flor levitar" alt="Flor">
    <img src="FES.png" id="flor4" class="flor levitar" alt="Flor">

    <!-- VISTA PRINCIPAL -->
    <div id="vista-principal" class="vista activa">
      <div class="titulo">
        <h1 class="prom">Prom</h1>
        <h2 class="anio">2026</h2>
      </div>
      <div id="boton-avisos" class="boton boton-icono-adelante" onclick="mostrarVista('avisos')">
        <img src="GAV.png" alt="Avisos"><span>Avisos</span>
      </div>
      <div id="boton-buzon" class="boton boton-texto-adelante" onclick="mostrarVista('buzon')">
        <span>Buzón</span><img src="GMC.png" alt="Buzón">
      </div>
      <div id="boton-mundialito" class="boton boton-icono-adelante" onclick="mostrarVista('mundialito')">
        <img src="MCA.png" alt="Mundialito"><span>Mundialito</span>
      </div>
      <div id="boton-Actividades" class="boton boton-texto-adelante" onclick="mostrarVista('Actividades')">
        <span>Actividades</span><img src="MIN.png" alt="Actividades">
      </div>
    </div>

    <!-- Login flotante -->
    <button id="btn-login" class="btn-login-mini">👤 Admin</button>
    <div id="user-info-area" class="user-info-area" style="display: none;"></div>
    <div id="modal-login" class="modal-login" style="display: none;">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h3>Acceso Admin</h3>
        <input type="text" id="username" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="ingresar-admin">Ingresar</button>
      </div>
    </div>

    <!-- VISTA AVISOS -->
  <div id="vista-avisos" class="vista">
  <div class="vista-secundaria">
    <div class="btn-volver" onclick="mostrarVista('principal')">← Volver</div>
    <h2>Avisos</h2>
    <div id="contenedor-avisos"></div>
  </div>
</div>

    <!-- VISTA BUZÓN -->
    <div id="vista-buzon" class="vista">
      <div class="vista-secundaria">
        <div class="btn-volver" onclick="mostrarVista('principal')">← Volver</div>
        <h2>Buzon</h2>
        <div id="mensajes-lista" class="mensajes-lista"></div>
        <div class="formulario-mensaje">
          <textarea id="nuevo-mensaje" placeholder="Escribe tu mensaje anónimo (solo el admin lo verá)"></textarea>
          <button onclick="enviarMensaje()">Enviar mensaje</button>
        </div>
      </div>
    </div>

    <!-- VISTA MUNDIALITO -->
    <div id="vista-mundialito" class="vista">
  <div class="vista-secundaria">
    <div class="btn-volver" onclick="mostrarVista('principal')">← Volver</div>

    function registrarVisita() {
  const hoy = new Date().toISOString().slice(0, 10); // formato YYYY-MM-DD
  const ultimaVisita = localStorage.getItem('ultimaVisita');
  let visitas = parseInt(localStorage.getItem('visitasMes')) || 0;

  if (ultimaVisita !== hoy) {
    // Nuevo día, aumentamos contador
    visitas++;
    localStorage.setItem('visitasMes', visitas);
    localStorage.setItem('ultimaVisita', hoy);
  }
  contadorVisitas = visitas;

  // Mostrar al admin si está logueado y está en alguna vista
  if (isAdmin) {
    mostrarContadorAdmin();
  }
}

function generarVistaInauguracion() {
  const container = document.getElementById('vistas-inauguracion-container');

    if (evento.tipo === "galeria") {

      evento.fotos.forEach(foto => {
        fotosHtml += `<img src="${foto}" alt="Inauguración" onclick="abrirLightbox('${foto}')" style="cursor:pointer">`;
      });
      let videoHtml = `<video width="100%" controls style="margin:20px 0; border-radius:20px;"><source src="${evento.video}" type="video/mp4"></video>`;

      html += `

async function enviarMensaje() {
  const texto = document.getElementById('nuevo-mensaje').value.trim();
  if(!texto) return alert('Escribe un mensaje');
  let ip = 'No disponible';
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    ip = data.ip;
  } catch(e) {}
  await db.collection('mensajes').add({
    texto,
    fecha: new Date().toLocaleString(),
    ip,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('nuevo-mensaje').value = '';
  if(isAdmin) renderizarMensajes();
  else alert('Mensaje enviado (solo visible para el admin)');
}

async function renderizarMensajes() {
  const lista = document.getElementById('mensajes-lista');
  if(!lista) return;
  const snapshot = await db.collection('mensajes').orderBy('timestamp', 'desc').get();
  if(snapshot.empty) {
    lista.innerHTML = '<p style="text-align:center; color:#aaa;">No hay mensajes</p>';
    return;
  }
  let html = '';
  snapshot.forEach(doc => {
    const m = doc.data();
    html += `<div class="mensaje-item">
              <div class="mensaje-fecha">${m.fecha}</div>
              <div class="mensaje-ip">IP: ${m.ip}</div>
              <div class="mensaje-texto">${m.texto}</div>
            </div>`;
  });
  lista.innerHTML = html;
}

    function mostrarTorneo(torneo) {
  let contenido = "";
  if (torneo === "programacion") {

          <div class="evento-agenda-desc">${evento.descripcion}</div>
        </div>
      `;
    });
    html += `</div>`;
    contenido = html;
  } else {
    const partidos = (torneo === "micro") ? partidosMicro : partidosVolei;
    let html = '';
    partidos.forEach(partido => {
      const vistaId = `${torneo}_${partido.id}`;
      html += `
        <div class="actividad-card" onclick="mostrarVistaPartido('${vistaId}')">
          <div class="actividad-titulo">⚽ ${partido.titulo}</div>
          <div class="actividad-desc">Haz clic para ver detalles, marcador y fotos.</div>
        </div>
      `;
    });
    contenido = html;
  }
  const contenedor = document.getElementById('contenedor-partidos');
  if (contenedor) contenedor.innerHTML = contenido;
}

    function generarVistasPartidos() {
      const container = document.getElementById('vistas-partidos-container');
      if (!container) return;
      let html = '';

      function generarHTMLPartido(partido, prefijo) {
        let goleadoresHtml = '<ul>';
        partido.goleadores.forEach(g => goleadoresHtml += `<li>${g}</li>`);
        goleadoresHtml += '</ul>';

        let fotosHtml = '';
        partido.fotos.forEach(fotoUrl => {
          fotosHtml += `<img src="${fotoUrl}" alt="Foto" onclick="abrirLightbox('${fotoUrl}')" style="cursor:pointer">`;
        });

        let videoHtml = '';
        if (partido.videoFile) {
          videoHtml = `<div style="margin:20px 0"><video width="100%" controls><source src="${partido.videoFile}" type="video/mp4"></video></div>`;
        } else if (partido.linkVideo) {
          if (partido.linkVideo.includes('youtu.be') || partido.linkVideo.includes('youtube.com')) {
            let videoId = '';
            if (partido.linkVideo.includes('youtu.be')) videoId = partido.linkVideo.split('/').pop().split('?')[0];
            else if (partido.linkVideo.includes('watch?v=')) videoId = partido.linkVideo.split('v=')[1].split('&')[0];
            if (videoId) videoHtml = `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${videoId}" frameborder="0"></iframe>`;
            else videoHtml = `<a href="${partido.linkVideo}" target="_blank">Ver video</a>`;
          } else {
            videoHtml = `<a href="${partido.linkVideo}" target="_blank">Ver video</a>`;
          }
        }

        return `
          <div id="vista-${prefijo}_${partido.id}" class="vista">
            <div class="vista-secundaria partido-info">
              <div class="btn-volver" onclick="mostrarVista('Actividades')">← Volver a Actividades</div>
              <h2>${partido.titulo}</h2>
              <div class="marcador">${partido.marcador}</div>
              <p><strong>Fecha:</strong> ${partido.fecha}</p>
              <p><strong>Lugar:</strong> ${partido.lugar}</p>
              ${videoHtml}
              <h3>Goleadores:</h3>
              ${goleadoresHtml}
              <h3>Fotos del partido:</h3>
              <div class="fotos-partido">${fotosHtml}</div>
            </div>
          </div>
        `;
      }

      partidosMicro.forEach(p => { html += generarHTMLPartido(p, 'micro'); });
      partidosVolei.forEach(p => { html += generarHTMLPartido(p, 'volei'); });

      container.innerHTML = html;
    }

function pedirNotificacion() {
  if (!("Notification" in window)) {
    console.log("Este navegador no soporta notificaciones");
    return;
  }
  if (Notification.permission === "granted") {
    new Notification("🎉 Promoción 2026", { body: "¡Bienvenido! Revisa los avisos y actividades." });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        new Notification("🎉 Promoción 2026", { body: "¡Notificaciones activadas! Te avisaremos de novedades." });
      }
    });
  }
}
